name: Build Windows EXE

on:
  push:
    branches: [claude/stoic-davinci-78qHy]
    paths:
      - 'wsub/**'
      - '.github/workflows/build-windows-exe.yml'
  workflow_dispatch:
    inputs:
      build_mode:
        description: '빌드 방식'
        required: true
        default: 'onedir'
        type: choice
        options:
          - onedir
          - onefile

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: wsub

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Python 3.11 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: wsub/requirements.txt

      - name: pip 업그레이드
        run: python -m pip install --upgrade pip

      - name: PyTorch CPU 버전 설치
        # GPU가 없는 CI 환경이므로 CPU 전용 설치 (파일 크기 절감)
        run: |
          pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu

      - name: 의존 패키지 설치
        run: |
          pip install PySide6 faster-whisper openai-whisper transformers `
            huggingface-hub ffmpeg-python numpy psutil requests pyinstaller

      - name: CUDA 12 런타임 DLL 설치 (GPU 가속용 번들)
        # ctranslate2 wheel은 cublas/cudnn DLL을 포함하지 않으므로
        # nvidia 휠에서 DLL을 받아 EXE에 번들한다. (CI에 GPU가 없어도 DLL은 설치됨)
        run: |
          pip install nvidia-cublas-cu12 nvidia-cudnn-cu12

      - name: FFmpeg 설치
        uses: FedericoCarboni/setup-ffmpeg@v3
        id: setup-ffmpeg
        with:
          ffmpeg-version: release

      - name: FFmpeg PATH 확인
        run: ffmpeg -version

      - name: onedir EXE 빌드
        if: ${{ github.event.inputs.build_mode != 'onefile' }}
        run: pyinstaller build.spec --noconfirm --clean

      - name: onefile EXE 빌드
        if: ${{ github.event.inputs.build_mode == 'onefile' }}
        run: pyinstaller build_onefile.spec --noconfirm --clean

      - name: 빌드 결과 확인
        run: |
          if (Test-Path "dist\W-Sub\W-Sub.exe") {
            Write-Host "✅ dist\W-Sub\W-Sub.exe 생성됨"
            Get-Item "dist\W-Sub\W-Sub.exe" | Select-Object Name, Length
          } elseif (Test-Path "dist\W-Sub.exe") {
            Write-Host "✅ dist\W-Sub.exe 생성됨"
            Get-Item "dist\W-Sub.exe" | Select-Object Name, Length
          } else {
            Write-Host "❌ EXE 파일을 찾을 수 없습니다"
            exit 1
          }

      - name: FFmpeg를 배포 폴더에 복사 (onedir)
        if: ${{ github.event.inputs.build_mode != 'onefile' }}
        run: |
          if (Test-Path "dist\W-Sub") {
            Copy-Item "${{ steps.setup-ffmpeg.outputs.ffmpeg-path }}\ffmpeg.exe" "dist\W-Sub\" -Force
            Copy-Item "${{ steps.setup-ffmpeg.outputs.ffmpeg-path }}\ffprobe.exe" "dist\W-Sub\" -Force
            Write-Host "✅ FFmpeg 복사 완료"
          }

      - name: 배포 패키지 ZIP 압축 (onedir)
        if: ${{ github.event.inputs.build_mode != 'onefile' }}
        run: |
          Compress-Archive -Path "dist\W-Sub" -DestinationPath "dist\W-Sub_windows_x64.zip"
          Write-Host "✅ W-Sub_windows_x64.zip 생성됨"

      - name: 아티팩트 업로드 (onedir 전체본)
        if: ${{ github.event.inputs.build_mode != 'onefile' }}
        uses: actions/upload-artifact@v4
        with:
          name: W-Sub_windows_x64
          path: wsub/dist/W-Sub_windows_x64.zip
          retention-days: 30

      # ── 패치 ZIP 생성: 해시 매니페스트 방식 ─────────────────────────────
      # 전체 2 GB+ ZIP을 다시 내려받지 않고, 파일별 SHA256 해시 목록(JSON)만
      # 캐시에 저장/복원해 diff → 변경 파일만 추출합니다.

      - name: 현재 빌드 해시 매니페스트 생성 (onedir)
        if: ${{ github.event.inputs.build_mode != 'onefile' }}
        shell: pwsh
        run: |
          $newRoot = Resolve-Path "dist\W-Sub"
          $manifest = [ordered]@{
            version  = "${{ github.sha }}"
            built_at = (Get-Date -Format "o")
            files    = [ordered]@{}
          }
          Get-ChildItem -Path $newRoot -Recurse -File | Sort-Object FullName | ForEach-Object {
            $rel = $_.FullName.Substring($newRoot.Path.Length + 1).Replace('\', '/')
            $manifest.files[$rel] = (Get-FileHash $_.FullName -Algorithm SHA256).Hash
          }
          $manifest | ConvertTo-Json -Depth 4 | `
            Set-Content -Path "dist\build_manifest.json" -Encoding UTF8
          Write-Host "매니페스트 생성: $($manifest.files.Count)개 파일"

      - name: 이전 빌드 매니페스트 복원 (캐시)
        if: ${{ github.event.inputs.build_mode != 'onefile' }}
        id: restore-manifest
        uses: actions/cache/restore@v4
        with:
          path: wsub/prev_manifest
          # 이번 커밋 키는 절대 hit 안 됨 → restore-keys로 직전 캐시를 자동 선택
          key: wsub-manifest-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            wsub-manifest-${{ github.ref_name }}-

      - name: 패치 ZIP 생성 (해시 비교)
        if: ${{ github.event.inputs.build_mode != 'onefile' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $prevJson = "prev_manifest\build_manifest.json"

          if (-not (Test-Path $prevJson)) {
            Write-Host "::notice::이전 매니페스트 없음 — 첫 빌드이거나 캐시 만료. 패치 생성을 건너뜁니다."
            exit 0
          }

          $prev    = (Get-Content $prevJson -Raw | ConvertFrom-Json).files
          $currJson = Get-Content "dist\build_manifest.json" -Raw | ConvertFrom-Json
          $curr    = $currJson.files
          $newRoot = Resolve-Path "dist\W-Sub"

          $changed = [System.Collections.Generic.List[string]]::new()
          $added   = [System.Collections.Generic.List[string]]::new()
          $deleted = [System.Collections.Generic.List[string]]::new()

          # 신규/변경 파일 탐지
          $curr.PSObject.Properties | ForEach-Object {
            $rel  = $_.Name
            $hash = $_.Value
            $prevHash = $prev.PSObject.Properties[$rel]?.Value
            if ($null -eq $prevHash)        { $added.Add($rel) }
            elseif ($hash -ne $prevHash)    { $changed.Add($rel) }
          }

          # 삭제된 파일 탐지
          $prev.PSObject.Properties | ForEach-Object {
            if ($null -eq $curr.PSObject.Properties[$_.Name]) {
              $deleted.Add($_.Name)
            }
          }

          Write-Host "추가: $($added.Count) / 변경: $($changed.Count) / 삭제: $($deleted.Count)"

          if ($added.Count -eq 0 -and $changed.Count -eq 0 -and $deleted.Count -eq 0) {
            Write-Host "::notice::변경 파일 없음 — 패치 생성 생략"
            "NO_PATCH=true" | Out-File -FilePath $env:GITHUB_ENV -Append
            exit 0
          }

          # 변경/추가 파일 복사 (디렉터리 구조 유지)
          $patchFiles = "dist\patch\W-Sub"
          New-Item -ItemType Directory -Force -Path $patchFiles | Out-Null

          $toCopy = [System.Linq.Enumerable]::Concat($added, $changed)
          foreach ($rel in $toCopy) {
            $src  = Join-Path $newRoot ($rel.Replace('/', '\'))
            $dest = Join-Path $patchFiles ($rel.Replace('/', '\'))
            New-Item -ItemType Directory -Force -Path (Split-Path $dest -Parent) | Out-Null
            Copy-Item $src $dest -Force
          }

          # 매니페스트 JSON
          $patchMeta = [ordered]@{
            from_version = (Get-Content $prevJson -Raw | ConvertFrom-Json).version
            to_version   = "${{ github.sha }}"
            built_at     = (Get-Date -Format "o")
            added        = @($added)
            changed      = @($changed)
            deleted      = @($deleted)
          }
          $patchMeta | ConvertTo-Json -Depth 5 | `
            Set-Content -Path "dist\patch\patch_manifest.json" -Encoding UTF8

          # apply_patch.bat 생성
          $bat = @(
            '@echo off',
            'setlocal enabledelayedexpansion',
            'set PATCH=%~dp0',
            'echo ================================================',
            'echo  W-Sub Patch Installer',
            'echo ================================================',
            'echo.',
            'set /p TARGET="W-Sub install folder (where W-Sub.exe is): "',
            'if not exist "!TARGET!\W-Sub.exe" (',
            '  echo [ERROR] W-Sub.exe not found. Check the path.',
            '  pause & exit /b 1',
            ')',
            'echo Applying patch...',
            'xcopy /E /Y /I "!PATCH!W-Sub\*" "!TARGET!\"',
            'if errorlevel 1 ( echo [ERROR] Copy failed. & pause & exit /b 1 )',
            "if exist ""!PATCH!patch_manifest.json"" (",
            '  echo.',
            '  echo Checking deleted files...',
            '  for /f "usebackq tokens=*" %%F in (`',
            '    powershell -NoProfile -Command "',
            '      (Get-Content ''!PATCH!patch_manifest.json'' | ConvertFrom-Json).deleted |',
            '      ForEach-Object { $_ }"',
            '  `) do (',
            '    if exist "!TARGET!\%%F" (',
            '      del /f /q "!TARGET!\%%F"',
            '      echo   Deleted: %%F',
            '    )',
            '  )',
            ')',
            'echo.',
            'echo [DONE] Patch applied successfully.',
            'pause'
          )
          $bat | Set-Content -Path "dist\patch\apply_patch.bat" -Encoding ASCII

          Compress-Archive -Path "dist\patch\*" -DestinationPath "dist\W-Sub_patch.zip" -Force
          Write-Host "✅ W-Sub_patch.zip 생성됨"

      - name: 패치 ZIP 업로드
        if: ${{ github.event.inputs.build_mode != 'onefile' && env.NO_PATCH != 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: W-Sub_patch
          path: wsub/dist/W-Sub_patch.zip
          if-no-files-found: ignore
          retention-days: 30

      - name: 현재 빌드 매니페스트를 prev_manifest에 복사 (다음 빌드용)
        if: ${{ github.event.inputs.build_mode != 'onefile' }}
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "prev_manifest" | Out-Null
          Copy-Item "dist\build_manifest.json" "prev_manifest\build_manifest.json" -Force

      - name: 현재 빌드 매니페스트 캐시 저장 (다음 빌드 패치 생성용)
        if: ${{ github.event.inputs.build_mode != 'onefile' }}
        uses: actions/cache/save@v4
        with:
          path: wsub/prev_manifest
          key: wsub-manifest-${{ github.ref_name }}-${{ github.sha }}

      - name: 아티팩트 업로드 (onefile)
        if: ${{ github.event.inputs.build_mode == 'onefile' }}
        uses: actions/upload-artifact@v4
        with:
          name: W-Sub_windows_x64_onefile
          path: wsub/dist/W-Sub.exe
          retention-days: 30
