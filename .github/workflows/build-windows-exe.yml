name: Build Windows EXE

on:
  push:
    branches: [claude/stoic-davinci-78qHy]
    paths:
      - 'wsub/**'
      - '.github/workflows/build-windows-exe.yml'
  workflow_dispatch:
    inputs:
      build_mode:
        description: '빌드 방식'
        required: true
        default: 'onedir'
        type: choice
        options:
          - onedir
          - onefile

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: wsub

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Python 3.11 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: wsub/requirements.txt

      - name: pip 업그레이드
        run: python -m pip install --upgrade pip

      - name: PyTorch CPU 버전 설치
        # GPU가 없는 CI 환경이므로 CPU 전용 설치 (파일 크기 절감)
        run: |
          pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu

      - name: 의존 패키지 설치
        run: |
          pip install PySide6 faster-whisper openai-whisper transformers `
            huggingface-hub ffmpeg-python numpy psutil requests pyinstaller

      - name: CUDA 12 런타임 DLL 설치 (GPU 가속용 번들)
        # ctranslate2 wheel은 cublas/cudnn DLL을 포함하지 않으므로
        # nvidia 휠에서 DLL을 받아 EXE에 번들한다. (CI에 GPU가 없어도 DLL은 설치됨)
        run: |
          pip install nvidia-cublas-cu12 nvidia-cudnn-cu12

      - name: FFmpeg 설치
        uses: FedericoCarboni/setup-ffmpeg@v3
        id: setup-ffmpeg
        with:
          ffmpeg-version: release

      - name: FFmpeg PATH 확인
        run: ffmpeg -version

      - name: onedir EXE 빌드
        if: ${{ github.event.inputs.build_mode != 'onefile' }}
        run: pyinstaller build.spec --noconfirm --clean

      - name: onefile EXE 빌드
        if: ${{ github.event.inputs.build_mode == 'onefile' }}
        run: pyinstaller build_onefile.spec --noconfirm --clean

      - name: 빌드 결과 확인
        run: |
          if (Test-Path "dist\W-Sub\W-Sub.exe") {
            Write-Host "✅ dist\W-Sub\W-Sub.exe 생성됨"
            Get-Item "dist\W-Sub\W-Sub.exe" | Select-Object Name, Length
          } elseif (Test-Path "dist\W-Sub.exe") {
            Write-Host "✅ dist\W-Sub.exe 생성됨"
            Get-Item "dist\W-Sub.exe" | Select-Object Name, Length
          } else {
            Write-Host "❌ EXE 파일을 찾을 수 없습니다"
            exit 1
          }

      - name: FFmpeg를 배포 폴더에 복사 (onedir)
        if: ${{ github.event.inputs.build_mode != 'onefile' }}
        run: |
          if (Test-Path "dist\W-Sub") {
            Copy-Item "${{ steps.setup-ffmpeg.outputs.ffmpeg-path }}\ffmpeg.exe" "dist\W-Sub\" -Force
            Copy-Item "${{ steps.setup-ffmpeg.outputs.ffmpeg-path }}\ffprobe.exe" "dist\W-Sub\" -Force
            Write-Host "✅ FFmpeg 복사 완료"
          }

      - name: 배포 패키지 ZIP 압축 (onedir)
        if: ${{ github.event.inputs.build_mode != 'onefile' }}
        run: |
          Compress-Archive -Path "dist\W-Sub" -DestinationPath "dist\W-Sub_windows_x64.zip"
          Write-Host "✅ W-Sub_windows_x64.zip 생성됨"

      - name: 아티팩트 업로드 (onedir 전체본)
        if: ${{ github.event.inputs.build_mode != 'onefile' }}
        uses: actions/upload-artifact@v4
        with:
          name: W-Sub_windows_x64
          path: wsub/dist/W-Sub_windows_x64.zip
          retention-days: 30

      # ── 패치 ZIP 생성: 직전 성공 빌드와 비교해 변경/추가 파일만 추출 ──
      - name: 직전 성공 빌드 다운로드 (패치 비교용)
        if: ${{ github.event.inputs.build_mode != 'onefile' }}
        id: download-prev
        continue-on-error: true   # 첫 빌드 등 직전 아티팩트가 없을 수 있음
        uses: dawidd6/action-download-artifact@v6
        with:
          name: W-Sub_windows_x64
          workflow: build-windows-exe.yml
          branch: ${{ github.ref_name }}
          search_artifacts: true
          if_no_artifact_found: warn
          path: wsub/prev_build

      - name: 패치 ZIP 생성 (변경 파일만)
        if: ${{ github.event.inputs.build_mode != 'onefile' && steps.download-prev.outcome == 'success' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $prevZip = Get-ChildItem -Path "prev_build" -Filter "*.zip" -Recurse | Select-Object -First 1
          if (-not $prevZip) {
            Write-Host "::warning::직전 빌드 ZIP을 찾을 수 없습니다 — 패치 생성을 건너뜁니다."
            exit 0
          }

          Write-Host "직전 빌드: $($prevZip.FullName)"
          Expand-Archive -Path $prevZip.FullName -DestinationPath "prev_extracted" -Force

          # 압축 해제 결과에서 W-Sub 루트 폴더 찾기
          $prevRoot = Join-Path "prev_extracted" "W-Sub"
          if (-not (Test-Path $prevRoot)) {
            $prevRoot = (Get-ChildItem -Path "prev_extracted" -Directory | Select-Object -First 1).FullName
          }
          $newRoot = "dist\W-Sub"

          Write-Host "이전 루트: $prevRoot"
          Write-Host "신규 루트: $newRoot"

          # 신규 빌드의 모든 파일을 이전 빌드와 해시 비교
          $patchDir = "dist\patch\W-Sub"
          New-Item -ItemType Directory -Force -Path $patchDir | Out-Null

          $changed = New-Object System.Collections.Generic.List[string]
          $added   = New-Object System.Collections.Generic.List[string]
          $deleted = New-Object System.Collections.Generic.List[string]

          $newFiles = Get-ChildItem -Path $newRoot -Recurse -File
          foreach ($f in $newFiles) {
            $rel = $f.FullName.Substring((Resolve-Path $newRoot).Path.Length + 1)
            $prevFile = Join-Path $prevRoot $rel

            $copy = $false
            if (-not (Test-Path $prevFile)) {
              $added.Add($rel); $copy = $true
            } else {
              $h1 = (Get-FileHash $f.FullName -Algorithm SHA256).Hash
              $h2 = (Get-FileHash $prevFile -Algorithm SHA256).Hash
              if ($h1 -ne $h2) { $changed.Add($rel); $copy = $true }
            }

            if ($copy) {
              $dest = Join-Path $patchDir $rel
              New-Item -ItemType Directory -Force -Path (Split-Path $dest -Parent) | Out-Null
              Copy-Item $f.FullName $dest -Force
            }
          }

          # 이전 빌드에는 있었으나 신규에는 없는 파일 (삭제 대상)
          $prevFiles = Get-ChildItem -Path $prevRoot -Recurse -File
          foreach ($f in $prevFiles) {
            $rel = $f.FullName.Substring((Resolve-Path $prevRoot).Path.Length + 1)
            if (-not (Test-Path (Join-Path $newRoot $rel))) {
              $deleted.Add($rel)
            }
          }

          # 매니페스트 작성 (적용 스크립트가 참조)
          $manifest = [ordered]@{
            version  = "${{ github.sha }}"
            built_at = (Get-Date).ToString("o")
            added    = $added
            changed  = $changed
            deleted  = $deleted
          }
          $manifest | ConvertTo-Json -Depth 5 | Set-Content -Path (Join-Path "dist\patch" "patch_manifest.json") -Encoding UTF8

          Write-Host "추가: $($added.Count) / 변경: $($changed.Count) / 삭제: $($deleted.Count)"

          if ($added.Count -eq 0 -and $changed.Count -eq 0 -and $deleted.Count -eq 0) {
            Write-Host "::warning::변경된 파일이 없습니다 — 패치 ZIP을 생성하지 않습니다."
            "NO_PATCH=true" | Out-File -FilePath $env:GITHUB_ENV -Append
            exit 0
          }

          # 패치 적용 스크립트(apply_patch.bat) 동봉
          $applyLines = @(
            '@echo off',
            'REM W-Sub patch apply script',
            'setlocal',
            'set SCRIPT_DIR=%~dp0',
            'echo ============================================',
            'echo  W-Sub patch apply',
            'echo ============================================',
            'echo.',
            'set /p TARGET="Install folder path (where W-Sub.exe is): "',
            'if not exist "%TARGET%\W-Sub.exe" (',
            '  echo [ERROR] W-Sub.exe not found in that folder.',
            '  pause',
            '  exit /b 1',
            ')',
            'echo Copying changed files...',
            'xcopy /E /Y /I "%SCRIPT_DIR%W-Sub\*" "%TARGET%\"',
            'echo.',
            'echo [DONE] Patch applied.',
            'pause'
          )
          $applyLines | Set-Content -Path (Join-Path "dist\patch" "apply_patch.bat") -Encoding ASCII

          Compress-Archive -Path "dist\patch\*" -DestinationPath "dist\W-Sub_patch.zip" -Force
          Write-Host "✅ W-Sub_patch.zip 생성됨"

      - name: 패치 ZIP 업로드
        if: ${{ github.event.inputs.build_mode != 'onefile' && steps.download-prev.outcome == 'success' && env.NO_PATCH != 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: W-Sub_patch
          path: wsub/dist/W-Sub_patch.zip
          retention-days: 30

      - name: 아티팩트 업로드 (onefile)
        if: ${{ github.event.inputs.build_mode == 'onefile' }}
        uses: actions/upload-artifact@v4
        with:
          name: W-Sub_windows_x64_onefile
          path: wsub/dist/W-Sub.exe
          retention-days: 30
